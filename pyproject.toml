[build-system]
requires = ["setuptools>=68", "wheel", "cython>=3.0", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "splade-easy"
version = "0.2.0"
description = "Simple, fast inference-free SPLADE retriever for small indexes"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Lee Miller" }]
keywords = ["splade", "sparse", "retrieval", "search", "ir"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "numpy>=2.0",
    "tokenizers>=0.20",
    "huggingface_hub>=0.25",
]

[project.optional-dependencies]
encode = [
    "torch>=2.4",
    "sentence-transformers>=5.0",
    # transformers 5.x has interop bugs with several inference-free SPLADE models'
    # custom modeling code — gte's batched attention silently produces NaN
    # encodings, persistent=False position_ids buffers come back uninitialized,
    # and MLM-head weight tying gets skipped. Pinning to the 4.x line fixes all
    # of these. sentence-transformers 5.5 accepts transformers>=4.41,<6, so this
    # is well within its supported range.
    "transformers>=4.55,<5",
]
eval = [
    "datasets>=3.0",
]

[project.scripts]
splade-eval-nanobeir = "splade_easy.eval.nanobeir:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=5.0",
    "ruff>=0.7",
    "pyinstrument>=5.0",
    "cython>=3.2.4",
    "cython-lint>=0.19.0",
    "pre-commit>=4.6.0",
    "bm25s>=0.3.8",
    "pystemmer>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"splade_easy" = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["splade_easy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]
